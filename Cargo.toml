[package]
name = "dwall"
version = "0.1.0"
edition = "2021"

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
image = "0.25"
gif = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# Подписи в меню. Чистый Rust, без системных шрифтовых библиотек — их в dwall
# не было и заводить их ради подписей не хотелось. Тот же выбор, что в dawn.
fontdue = "0.9"

[build-dependencies]
# Привязки к ffmpeg генерируются по заголовкам системы — см. build.rs.
bindgen = "0.71"
pkg-config = "0.3"

[profile.release]
# Живые обои теперь декодируются и раздаются в горячем цикле внутри самого
# dwall, а не в отдельном процессе ffmpeg, — оптимизатору есть что смотреть.
lto = "thin"

